name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
      - 'careerpilot.mjs'
      - 'generate-pdf.mjs'
      - 'build-cv-html.mjs'
      - 'cv-templates.mjs'
      - 'lib/careerpilot/**'
      - 'schemas/cn/**'
      - 'templates/cn/**'
      - 'templates/careerpilot-resume-template.html'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'careerpilot.mjs'
      - 'generate-pdf.mjs'
      - 'build-cv-html.mjs'
      - 'cv-templates.mjs'
      - 'lib/careerpilot/**'
      - 'schemas/cn/**'
      - 'templates/cn/**'
      - 'templates/careerpilot-resume-template.html'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # CandidateProfile Web routes execute the canonical root CLI, whose Ajv
      # and YAML dependencies live in the root lockfile. Install without the
      # Playwright postinstall because Web API tests do not launch Chromium.
      - name: Install CareerPilot core dependencies
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Chromium for CareerPilot Web E2E
        run: npx playwright install chromium --with-deps
        working-directory: .
      - name: CareerPilot Web E2E
        run: npm run careerpilot:web-e2e
        working-directory: .
